name: Scrape Cron Job

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch: # Allows manual trigger for testing
  push:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install Dependencies
        working-directory: ./scraper
        run: npm install

      - name: Create Service Account Key
        # Secrets are not available in pull requests from forks
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_2 }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > scraper/serviceAccountKey.json
          echo "$FIREBASE_SERVICE_ACCOUNT_2" > scraper/serviceAccountKey2.json

      - name: Run Scraper
        working-directory: ./scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js
